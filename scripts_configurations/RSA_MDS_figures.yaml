# =============================================================================
# RSA and MDS Figure Configuration
# =============================================================================
#
# This configuration file controls the visualization of Representational Similarity
# Analysis (RSA) and Multidimensional Scaling (MDS) plots for Figure S4 and Figure 4.
#
# Purpose:
# --------
# Defines which pre-computed similarity matrices to load and visualize, and which
# models to include in the analysis.
#
# Workflow:
# ---------
# 1. Load similarity matrix from Results/rsa/ directory
# 2. Select models based on include_additional_models flag
# 3. Generate publication-quality RSA heatmap or MDS scatter plot
#
# Related Scripts:
# ----------------
# - figures_scripts/Figure_S4_RSA.py: RSA heatmap generation
# - figures_scripts/Figure_4_MDS.py: MDS scatter plot generation
# - analysis_scripts/build_rsa_sim_matrix.py: Similarity matrix computation
#
# =============================================================================

defaults:
  - _self_
  - shared_args  # Import model lists, formal names, objectives, etc.

# =============================================================================
# Model Selection
# =============================================================================

# Include additional models beyond the base 20 models
# If False: Uses only base 20 models (paper version)
# If True: Uses 30 models (20 base + 10 additional, extended version)
# Note: Must match the include_new_models setting used when running
#       build_rsa_sim_matrix.py to generate the similarity matrix
include_additional_models: False

# =============================================================================
# Feature Configuration
# =============================================================================

# Dimensionality of features used in similarity computation
# Options: "full" (all dimensions) or "PCA_500" (500 principal components)
# Must match the features_dim used in build_rsa_sim_matrix.py
features_dim: "full"

# Transformation constraint type
# Options: "zero_shot", "diagonal", "Rectangular_N", "full_W"
# Must match transformed_features_constraints in build_rsa_sim_matrix.py
transformed_features_constraints: "full_W"

# =============================================================================
# Data Paths
# =============================================================================

# Base directory containing RSA similarity matrices
rsa_results_dir: "Results/rsa"

# Similarity matrix filenames are constructed as:
# - Without additional models: "sim_{features_dim}_dim_{constraints}.nc"
# - With additional models: "sim_{features_dim}_dim_{constraints}_additional_models.nc"
# These files are generated by analysis_scripts/build_rsa_sim_matrix.py

# =============================================================================
# Output Configuration
# =============================================================================

# Output directory for generated figures
output_dir: "Plots"

# Figure dimensions (centimeters)
figure_width_cm: 8
figure_height_cm: 10

# =============================================================================
# Notes for Users
# =============================================================================
#
# Typical Usage:
# -------------
# # Paper version (20 models)
# python figures_scripts/Figure_S4_RSA.py
# python figures_scripts/Figure_4_MDS.py
#
# # Extended version (30 models)
# python figures_scripts/Figure_S4_RSA.py include_additional_models=True
# python figures_scripts/Figure_4_MDS.py include_additional_models=True
#
# Data Requirements:
# ------------------
# Before running these scripts, you must first generate the similarity matrices:
# python analysis_scripts/build_rsa_sim_matrix.py include_new_models=False  # For 20 models
# python analysis_scripts/build_rsa_sim_matrix.py include_new_models=True   # For 30 models
#
# File Naming Convention:
# ----------------------
# The script automatically constructs the correct filename based on parameters:
# - include_additional_models=False → sim_full_dim_full_W.nc
# - include_additional_models=True → sim_full_dim_full_W_additional_models.nc
#
# =============================================================================