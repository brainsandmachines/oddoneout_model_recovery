# =============================================================================
# EXPERIMENT: zero_shot
# =============================================================================
# Zero-shot evaluation: No learned transformation (W = Identity).
# Tests whether models can be distinguished without any feature alignment.
#
# Data Flow:
# 1. Features: Data/models_features/models_original_features/full/*.pt
# 2. Models: Data/models_data_generating/full/models_zero_shot/*.pkl
# 3. Database: Results/Simulations_experiments/zero_shot/zero_shot.db
#
# Key Constraint:
# - W matrix is fixed as identity (no parameters to learn)
# - Regularization constant is 0 (no regularization needed)
# - K_folds = 5 for more robust zero-shot evaluation
# =============================================================================
"zero_shot":
    paths:
      data_generating_models: "Data/models_data_generating/full/models_zero_shot"
      data_generating_features_folder: "Data/models_features/models_original_features/full"
      reference_models_features_folder: "Data/models_features/models_original_features/full" 
      triplets_to_exclude: "Data/Things_data_preprocessed/Things_odd_one_out_triplets_all.pt"
      results_folder: "Results/Simulations_experiments/"
      db_file_name: "zero_shot.db"  

    experiment:
      used_additional_models: False  # No additional models
      N_concepts: 1854
      N_participants: 1
      K_folds: 3  # More folds for zero-shot (no overfitting risk)
      regularization_constants_list: [0]  # No regularization (W is fixed)
      reg_func: "eye_distance"  # Reg function doesn't matter (constant=0)



# =============================================================================
# EXPERIMENT: diagonal
# =============================================================================
# Diagonal constraint: W matrix restricted to diagonal (element-wise scaling).
# Tests whether cross-feature transformations are necessary for recovery.
#
# Data Flow:
# 1. Features: Data/models_features/models_original_features/full/*.pt
# 2. Models: Data/models_data_generating/full/models_diagonal/*.pkl
# 3. Database: Results/Simulations_experiments/diagonal/diagonal.db
#
# Key Constraint:
# - W has only diagonal elements (d parameters instead of d²)
# - Allows feature-wise scaling but no feature mixing
# - Much fewer parameters than full_W
# =============================================================================
"diagonal":
  paths:
    data_generating_models: "Data/models_data_generating/full/models_diagonal"
    data_generating_features_folder: "Data/models_features/models_original_features/full"
    reference_models_features_folder: "Data/models_features/models_original_features/full" 
    triplets_to_exclude: "Data/Things_data_preprocessed/Things_odd_one_out_triplets_all.pt"
    results_folder: "Results/Simulations_experiments/"
    db_file_name: "diagonal.db"
  experiment:
    used_additional_models: False  # No additional models
    N_concepts: 1854
    N_participants: 1
    K_folds: 3
    # Extended regularization range for diagonal constraint
    regularization_constants_list: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1, 10, 100, 1000, 10000]
    reg_func: "eye_distance"  # Shrinks diagonal toward uniform scaling



# =============================================================================
# EXPERIMENT: rectangular_30
# =============================================================================
# Rectangular (low-rank) constraint: W projects to 30-dimensional bottleneck.
# Tests whether low-dimensional transformations suffice for model recovery.
#
# Data Flow:
# 1. Features: Data/models_features/models_original_features/full/*.pt
# 2. Models: Data/models_data_generating/full/models_rectangular_30/*.pkl
# 3. Database: Results/Simulations_experiments/rectangular_30/rectangular_30.db
#
# Key Constraint:
# - W = U @ V where U is (d × 30) and V is (30 × d)
# - Forces rank-30 approximation (30d parameters instead of d²)
# - Tests sufficiency of 30-dimensional representation bottleneck
# =============================================================================
"rectangular_30":
  paths:
    data_generating_models: "Data/models_data_generating/full/models_rectangular_30"
    data_generating_features_folder: "Data/models_features/models_original_features/full"
    reference_models_features_folder: "Data/models_features/models_original_features/full" 
    triplets_to_exclude: "Data/Things_data_preprocessed/Things_odd_one_out_triplets_all.pt"
    results_folder: "Results/Simulations_experiments/"
    db_file_name: "rectangular_30.db"  
  experiment:
    used_additional_models: False  # No additional models
    N_concepts: 1854
    N_participants: 1
    K_folds: 3  # More folds for low-rank constraint
    # Extended regularization range
    regularization_constants_list: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1, 10, 100, 1000, 10000]
    reg_func: "eye_distance"  # Regularizes toward identity in bottleneck space

