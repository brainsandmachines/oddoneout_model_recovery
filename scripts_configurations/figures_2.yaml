  diagonal: "predictive accuracy $(W \\in Diag(\\mathbb{R}^{p\\times p}))$"
  Rectangular_10: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 10})$"
  Rectangular_20: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 20})$"
  Rectangular_30: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 30})$"
  Rectangular_40: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 40})$"
  Rectangular_50: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 50})$"
  Rectangular_60: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 60})$"
  Rectangular_70: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 70})$"
  Rectangular_80: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 80})$"
  Rectangular_90: "predictive accuracy $(W \\in \\mathbb{R}^{p\\times 90})$"
