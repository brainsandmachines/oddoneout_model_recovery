# =============================================================================
# Figure 2 Configuration - Model Accuracy on THINGS Odd-One-Out Task
# =============================================================================
#
# This configuration file controls the generation of Figure 2, which displays
# model predictive accuracy on the THINGS odd-one-out behavioral task across
# different transformation flexibility levels.
#
# Paper Context:
# --------------
# Figure 2 shows how 32 vision models perform on predicting human odd-one-out
# choices from the THINGS dataset under different linear transformation
# constraints (W matrix flexibility levels). The figure demonstrates that
# while increased flexibility improves accuracy, it comes at the cost of
# reduced model identifiability (as shown in later figures).
#
# Figure Components:
# -----------------
# - Horizontal bar plots: Model accuracy with 95% confidence intervals
# - Metroplot: Statistical pairwise comparisons between models (sign tests)
# - Color coding: Models grouped by training objective (supervised, 
#   self-supervised, multimodal)
# - Architecture annotations: 'T' (Transformer) vs 'C' (CNN)
# - Reference lines: Chance level (33%) and noise ceiling (67%)
#
# =============================================================================

defaults:
  - _self_
  - figure_base      # Base figure formatting parameters (font sizes, etc.)
  - shared_args      # Shared model lists and objectives

# =============================================================================
# General Configuration
# =============================================================================

# Output naming for saved files and directories
figure_output_name: 'THINGS_accuracy'  # Prefix for output folders and files

# Number of color gradations for each model category (for visual distinctiveness)
colors_for_each_group:
  supervised: 13          # Number of color steps for supervised models
  self_supervised: 5      # Number of color steps for self-supervised models  
  multimodal: 12          # Number of color steps for multimodal models

# Feature representation type to use
features_type: 'full'             # Options: 'full' (all features) or 'PCA_500' (500 PCA components)
use_additional_models: False      # Set to True to include 10 additional models (Figure S4/S5)

# =============================================================================
# Transformation Flexibility Levels (Constraint Types)
# =============================================================================
# Each constraint type represents a different level of flexibility in the
# linear transformation W that maps model representations to the behavioral
# prediction space.
#
# Constraint type definitions:
# - 'zero_shot': W = I (identity matrix, no transformation)
# - 'diagonal': W ∈ Diag(ℝ^{p×p}) (diagonal scaling only)
# - 'Rectangular_N': W ∈ ℝ^{p×N} (rank-N projection)
# - 'full_W': W ∈ ℝ^{p×p} (full linear transformation)
#
# Maximum 4 constraint types can be displayed (figure layout limitation)
# =============================================================================

constraint_types: ['zero_shot', 'diagonal', 'Rectangular_30', 'full_W']

# Regularization method applied during model training
# Options: 'eye_distance' (distance from identity) or 'L2' (standard L2 penalty)
regularization_type: 'eye_distance'

# =============================================================================
# Path Configuration
# =============================================================================

# Base directory containing model evaluation results
# Structure: {results_base_dir}/{features_type}/{constraint_type}/
# 
# IMPORTANT: This path must match the results_out path from evaluate_THINGS_OOO_accuracy_CV.yaml!
# 
# Default behavior (evaluating BOTH L2 and eye_distance):
#   - The directory contains results for BOTH regularization types
#   - Separate CSV files exist for each: best_test_acc_L2_*.csv and best_test_acc_eye_distance_*.csv
#   - The directory name uses the primary/default regularization as suffix
results_base_dir: 'Results/regularization_methods_compare_all_models_eye_distance'
#
# The regularization_type parameter below selects WHICH results to use from this directory.
# You can switch between L2 and eye_distance results without changing this path:
#   regularization_type: "eye_distance"  # Uses best_test_acc_eye_distance_*.csv
#   regularization_type: "L2"             # Uses best_test_acc_L2_*.csv
#
# Only change this path if you created a separate evaluation run with different regularization:
#   Example: "Results/regularization_methods_compare_all_models_L2" (L2-only evaluation)

# Directory containing partitioned THINGS dataset folds
data_base_dir: 'Data/Things_data_preprocessed/partitions_folds'

# =============================================================================
# Statistical Analysis Settings
# =============================================================================

# Confidence level for binomial confidence intervals on accuracy estimates
confidence_level: 0.95

# Force recomputation of accuracy and statistical comparisons even if files exist
force_recompute: false

# =============================================================================
# Model Selection and Ordering
# =============================================================================
# Models are listed in display order (top to bottom in figure)
# Grouped by training objective: supervised → self-supervised → multimodal
# Within each group, models are ordered to facilitate visual comparison
# =============================================================================

models_grouped_list: [
  # -------------------------------------------------------------------------
  # Supervised Models (ImageNet classification)
  # -------------------------------------------------------------------------
  # CNN architectures
    'ResNet50',           # Residual networks
    'VGG19',              # Classic deep CNN
    'DenseNet201',        # Densely connected networks
    'ConvNext_Large',     # Modern CNN with transformer-inspired design
    'EfficientNet_B7',    # Compound scaling architecture
    'NASNet_Large',       # Neural architecture search
    'CORnet_S',           # Brain-inspired recurrent CNN
    'AlexNet',            # Historic baseline CNN
    
  # Hybrid and Transformer architectures
    'InceptionRN_V2',     # Inception-ResNet hybrid
    'Inception_V3',       # Multi-scale inception modules
    'Google_ViT_Large',   # Vision Transformer (original)
    'Deit3_Huge',         # Data-efficient Image Transformer
    'Beit_V2_Large',      # Masked image modeling (self-supervised pretraining + supervised fine-tuning)
    
  # -------------------------------------------------------------------------
  # Self-Supervised Models (contrastive/predictive objectives)
  # -------------------------------------------------------------------------
    'DINOv2_ViT_Large',        # Self-distillation with no labels (v2)
    'Fair_SimCLR_ViT_Large',   # Simple contrastive learning (Meta AI)
    'BarlowTwins_RN50',        # Redundancy reduction objective
    'SWAV_RN50',               # Swapped prediction clustering
    'VicReg_RN50',             # Variance-Invariance-Covariance regularization
    
  # -------------------------------------------------------------------------
  # Multimodal Models (image-text alignment)
  # -------------------------------------------------------------------------
    'Fair_Clip_ViT_Large',     # Contrastive language-image pretraining (Meta AI)
    'Fair_SLIP_ViT_Large',     # Self-supervised + language-image pretraining (Meta AI)
    'Clip_RN50',               # Original CLIP with ResNet backbone (OpenAI)
    'OpenCLIP_ConvNext_XL',    # Open-source CLIP with ConvNext
    'ALIGN',                   # Large-scale noisy image-text pairs (Google)
    'FLAVA_Full',              # Foundational language and vision alignment
    'SigLIP2_Base_P16_224',    # Sigmoid loss CLIP variant
    'BLIP_2',                  # Bootstrapped language-image pretraining
    'EVA02_CLIP_Enormous',     # Enormous-scale CLIP variant
    'PE_Huge',                 # Perception encoder
    'Image_Bind_Huge',         # Multi-modal binding across 6+ modalities
    'Clip_ViT_Large'           # CLIP with Vision Transformer (OpenAI)
]

