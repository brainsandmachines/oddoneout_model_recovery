# =============================================================================
# Figure 5 Configuration: Transformation Flexibility vs. Accuracy Tradeoff
# =============================================================================
#
# This configuration file controls the generation of Figure 5, which visualizes
# the tradeoff between transformation flexibility and model performance. The
# figure demonstrates how different constraint types (from rigid identity matrix
# to fully flexible transformations) affect both predictive accuracy and model
# recovery performance.
#
# Figure Overview:
# ---------------
# Figure 5 shows a scatter plot where:
# - X-axis: Model recovery accuracy (ability to identify the correct model)
# - Y-axis: Mean predictive accuracy (performance on held-out triplets)
# - Colors: Different constraint types (flexibility levels)
# - Markers: Different training set sizes
# - Connecting lines: Show progression for each constraint type
#
# Scientific Question:
# -------------------
# Does increasing transformation flexibility (from zero-shot to full matrix)
# improve predictive accuracy at the cost of model identifiability?
#
# Key Finding:
# -----------
# More flexible transformations achieve higher predictive accuracy but lower
# model recovery accuracy, revealing a fundamental tradeoff in alignment metrics.
#
# =============================================================================

# Import base figure settings (font sizes, dimensions, formal names)
defaults:
  - _self_
  - figure_base

# =============================================================================
# Data Source Configuration
# =============================================================================

# Path to the aggregated results file
# This CSV contains pre-computed metrics for all constraint types and
# training set sizes, generated by analysis_scripts/figure_5_analysis.py
save_path: "Results/flexibility_accuracy"

# Expected columns in final_results_df.csv:
# - constraint: Transformation constraint type
# - train_set_size: Number of training triplets
# - test_acc: Mean predictive accuracy across models
# - test_acc_std: Standard deviation of test accuracy
# - model_recovery_acc: Percentage of correct model identifications
# - max_acc_model: Name of best-performing model
# - max_acc_model_acc: Accuracy of best model
# - min_acc_model: Name of worst-performing model  
# - min_acc_model_acc: Accuracy of worst model

# =============================================================================
# Constraint Types: Transformation Flexibility Levels
# =============================================================================

# List of constraint types to include in the figure
# Ordered from least to most flexible (affects color gradient)
constraint_types_to_plot:
  - "zero_shot"        # Identity matrix (W = I), no learning
  - "diagonal"         # Element-wise scaling only (W ∈ Diag_p(ℝ))
  - "Rectangular_30"   # Low-rank projection to 30 dimensions (W ∈ ℝ^(p×30))
  - "full_W_L1"        # Full matrix with L1 regularization (W ∈ ℝ^(p×p))
  - "full_W"           # Full unconstrained matrix (W ∈ ℝ^(p×p))

# Constraint flexibility ranking (used for color mapping)
# Lower values = less flexible = cooler colors (blue)
# Higher values = more flexible = warmer colors (red)
flexibility_ranking:
  zero_shot: 0
  diagonal: 1
  Rectangular_30: 2
  full_W_L1: 3
  full_W: 4

# LaTeX formatted constraint names for publication-quality labels
constraint_latex_names:
  flexibility:
    zero_shot: "$\\mathbf{W} = I_{p \\times p}$"
    diagonal: "$\\mathbf{W}\\in \\mathrm{Diag}_p(\\mathbb{R})$"
    Rectangular_30: "$\\mathbf{W} \\in \\mathbb{R}^{p\\times 30}$"
    full_W_L1: "$\\mathbf{W} \\in \\mathbb{R}^{p\\times p}$"
    full_W: "$\\mathbf{W} \\in \\mathbb{R}^{p\\times p}$"
  
  regularization:
    zero_shot: "$\\mathbf{W} = I$"
    diagonal: "$\\|\\mathbf{W} - I\\|_F^2$"
    Rectangular_30: "$\\|\\mathbf{W}\\mathbf{W}^T -\\gamma I\\|_F^2$"
    full_W_L1: "$\\|\\mathbf{W}\\|_1$"
    full_W: "$\\|\\mathbf{W} -\\gamma I\\|_F^2$"

# =============================================================================
# Figure Layout and Styling
# =============================================================================

# Figure dimensions (in centimeters)
# Using half-width size for single-column publication format
figure_dimensions:
  width_cm: ${half_width_size_figure}   # Inherits from figure_base.yaml (6.985 cm)
  height_cm: 6                          # Adjusted for good aspect ratio

# Font sizes (points)
# Inherits base sizes from figure_base.yaml but can override specific elements
font_sizes:
  axis_title: 4                         # X/Y axis labels (half of panel_letter_fontsize)
  tick_labels: ${tick_labels_fontsize}  # Axis tick numbers (from figure_base)
  legend: ${legend_fontsize}            # Legend text (from figure_base)
  panel_letter: ${panel_letter_fontsize} # Panel labels (from figure_base)

# Marker and plot styling
plot_styling:
  marker_size: 10                       # Size of scatter plot points
  legend_marker_size: 4                 # Size of markers in legend
  line_style: ":"                       # Dotted lines connecting points
  line_width: 1                         # Width of connecting lines
  line_alpha: 0.7                       # Transparency of connecting lines

# Axis configuration
axis_settings:
  swap_axes: true                       # If true: X=recovery_acc, Y=test_acc
                                        # If false: X=test_acc, Y=recovery_acc
  show_grid: false                      # Whether to show grid lines
  tick_precision:
    x_axis: 1                           # Decimal places for x-axis labels
    y_axis: 2                           # Decimal places for y-axis labels
  
  # Smart tick generation parameters
  # Creates denser ticks in regions with more data points
  smart_ticks:
    enabled: true
    n_clusters: 4                       # Number of density clusters to identify
    ticks_per_cluster: 3                # Tick marks per dense region
    min_ticks: 6                        # Minimum total ticks
    max_ticks: 12                       # Maximum total ticks

# Color scheme
# Uses matplotlib's 'coolwarm' colormap for flexibility gradient
# Cool colors (blue) = less flexible, warm colors (red) = more flexible
colormap: "coolwarm"

# =============================================================================
# Legend Configuration
# =============================================================================

# Three separate legends showing different information:
# 1. Flexibility: Shows constraint types with colored circles
# 2. Regularization: Shows regularization formulas (no markers)
# 3. Train set size: Shows training sizes with different marker shapes

legend_settings:
  flexibility:
    title: "flexibility"
    title_fontsize: ${legend_fontsize}
    fontsize: ${legend_fontsize}
    frameon: false                      # No border around legend
    loc: "center left"
    handletextpad: 0.5                  # Space between marker and text
    labelspacing: 0.5                   # Vertical space between entries
  
  regularization:
    title: "regularization"
    title_fontsize: ${legend_fontsize}
    fontsize: ${legend_fontsize}
    frameon: false
    loc: "center left"
    handletextpad: 0.5
    labelspacing: 0.5
  
  train_size:
    title: "train set size"
    title_fontsize: ${legend_fontsize}
    fontsize: ${legend_fontsize}
    frameon: false
    loc: "center"
    handletextpad: 0.5
    labelspacing: 1.2                   # More space for readability

# Marker shapes for different training set sizes
# Each unique train set size gets a distinct marker
train_size_markers:
  default_shapes: ['o', 's', '^', 'd', 'v', '<', '>', 'p', '*', 'h', 'H', '+', 'x']
  # Actual markers assigned dynamically based on unique sizes in data

# =============================================================================
# GridSpec Layout (Precise panel positioning)
# =============================================================================

# GridSpec configuration for precise control over subplot positions
# This creates a grid layout for the main plot and three legends
gridspec:
  nrows: 5                              # Total rows in grid
  ncols: 9                              # Total columns in grid
  
  # Row height ratios (relative units)
  height_ratios: [0.2, 4, 1, 1.1, 0.3]
  # Row 0: Top margin (0.2 units)
  # Row 1: Main plot (4 units - largest)
  # Row 2: Space between plot and legends (1 unit)
  # Row 3: Legend row (1.1 units)
  # Row 4: Bottom margin (0.3 units)
  
  # Column width ratios (relative units)
  width_ratios: [0.8, 0.6, 0.8, 0.3, 0.8, 0.8, 0.8, 0.6, 0.1]
  # Col 0: Left margin
  # Col 1-7: Main plot area (spans multiple columns)
  # Col 2: Flexibility legend
  # Col 4: Regularization legend  
  # Col 6: Train set size legend
  # Col 8: Right margin
  
  # Spacing between grid cells
  hspace: 0                             # No extra horizontal spacing
  wspace: 0                             # No extra vertical spacing

# Subplot positions (defined by grid cell indices)
subplot_positions:
  main_plot:
    row_start: 1
    row_end: 2
    col_start: 1
    col_end: 8
  
  flexibility_legend:
    row_start: 3
    row_end: 4
    col_start: 2
    col_end: 3
  
  regularization_legend:
    row_start: 3
    row_end: 4
    col_start: 4
    col_end: 5
  
  train_size_legend:
    row_start: 3
    row_end: 4
    col_start: 6
    col_end: 7

# =============================================================================
# Output Settings
# =============================================================================

# Output file configuration
output:
  directory: "Plots"                    # Base output directory
  filename: "Figure_5.pdf"              # Output filename
  format: "pdf"                         # Output format (pdf for publication)
  dpi: 600                              # Resolution for raster elements
  
# =============================================================================
# Advanced Options
# =============================================================================

# Whether to use top-performing model accuracy instead of mean accuracy
# If true: Y-axis shows max_acc_model_acc instead of test_acc
use_top_model_accuracy: false

# Whether to show error bars on scatter points
# If true: Shows test_acc_std as error bars
show_error_bars: false

# Filter constraints to plot (if you want a subset)
# Set to null to use all constraints from constraint_types_to_plot
# Example: ["zero_shot", "full_W"] to show only endpoints
filter_constraints: null

# =============================================================================
# Notes for Users
# =============================================================================
#
# To generate Figure 5:
# --------------------
# python Figure_5_tradeoff.py
#
# The script will:
# 1. Load data from Results/flexibility_accuracy/final_results_df.csv
# 2. Filter to specified constraint types
# 3. Create scatter plot with color-coded constraints and marker-coded sizes
# 4. Add three legends showing flexibility, regularization, and train sizes
# 5. Save publication-quality PDF to Plots/Figure_5.pdf
#
# To customize the figure:
# -----------------------
# # Change which constraints to show
# python Figure_5_tradeoff.py constraint_types_to_plot="['zero_shot','full_W']"
#
# # Show error bars
# python Figure_5_tradeoff.py show_error_bars=true
#
# # Change output location
# python Figure_5_tradeoff.py output.directory="Plots/custom"
#
# # Use different dimensions
# python Figure_5_tradeoff.py figure_dimensions.width_cm=10 figure_dimensions.height_cm=8
#
# Data Requirements:
# -----------------
# The script expects Results/flexibility_accuracy/final_results_df.csv to exist
# with the following structure:
#
# constraint,train_set_size,test_acc,test_acc_std,model_recovery_acc,...
# zero_shot,400,0.623,0.045,0.892,...
# diagonal,400,0.681,0.038,0.756,...
# full_W,400,0.723,0.041,0.523,...
# ...
#
# This file is generated by running:
# python analysis_scripts/figure_5_analysis.py
#
# See USAGE_GUIDE_evaluate_THINGS.md for details on data generation.
#
# =============================================================================
