    N_concepts: 1854
    N_simulations: 10
    N_participants: 1
    K_folds: 3
    constraints: "diagonal"  # Constrain W to be diagonal
    dim_reduction_method: 
    data_generating_model_regularization: 
    candidate_model_regularization: 
    include_additional_models: False

# =============================================================================
# EXPERIMENT: rectangular_30
# =============================================================================
# Tests rectangular (low-rank) weight matrix constraint where the transformation
# projects to a lower-dimensional space (30 dimensions) and back.
#
# Key features:
# - Rectangular constraint (W = U @ V where U is d×30 and V is 30×d)
# - Forces low-rank approximation (rank 30)
# - Tests if 30-dimensional bottleneck is sufficient
# - 4 dataset sizes
# - 10 simulations per condition
# =============================================================================
"rectangular_30":
  paths:
    data_generating_models: "Data/models_data_generating/full/rectangular_30"
    data_generating_features_folder: Data/models_features/models_original_features/full
    reference_models_features_folder: Data/models_features/models_original_features/full 
    triplets_to_exclude: "Data/Things_data_preprocessed/Things_odd_one_out_triplets_all.pt"
    results_folder: "Results/Simulations_experiments/"
    results_file_name: "rectangular_30"  
  experiment:
    N_train_triplets_list: [
                            400,
                            25600,
                            204800,
                            1638400,
    ]
    N_concepts: 1854
    N_simulations: 10
    constraints: ("rectangular", 30)  # Rectangular constraint with rank 30
    dim_reduction_method: 
    data_generating_model_regularization: 
    candidate_model_regularization:   
    include_additional_models: False    



