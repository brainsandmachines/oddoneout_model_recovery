# =============================================================================
# Simulation Database Configuration for Model Recovery Experiments
# =============================================================================
#
# This configuration file defines different experimental setups for testing
# model recovery performance under various conditions. Each experiment type
# specifies paths, parameters, and constraints for simulation jobs.
#
# The configuration uses Hydra for hierarchical configuration management:
# - shared_args.yaml: Contains the list of models to test
# - This file: Defines experiment-specific parameters
#
# Usage:
#   python create_simulations_db.py experiment_type=<experiment_name>
#
# =============================================================================

defaults:
  - _self_
  - shared_args  # Import shared arguments (contains models list, etc.)

# Default experiment type - can be overridden via command line
experiment_type: "full_W"


# =============================================================================
# EXPERIMENT: full_W_L1
# =============================================================================
# Tests model recovery with L1 regularization on both data-generating and
# candidate models. L1 regularization encourages sparse weight matrices.
#
# Key features:
# - Uses L1 regularization for both data-generating and candidate models
# - Tests across 4 different dataset sizes
# - 10 simulation runs per condition

# =============================================================================
"full_W_L1":
  paths:
    data_generating_models: "Data/models_data_generating_L1/models_full_W"
    data_generating_features_folder: Data/models_features/models_original_features/full
    reference_models_features_folder: Data/models_features/models_original_features/full
    triplets_to_exclude: "Data/Things_data_preprocessed/Things_odd_one_out_triplets_all.pt"
    results_folder: "Results/Simulations_experiments/"
    results_file_name: "full_W_L1_test"  # Name for the database file
    
  experiment:
    N_train_triplets_list: [
                            400,
                            25600,
                            204800,
                            1638400,
                            ]
    N_concepts: 1854  # Number of concepts in THINGS dataset
    N_simulations: 10  # Number of independent runs per condition
    N_participants: 1  # Number of simulated participants
    constraints:   # No constraints (full weight matrix)
    dim_reduction_method:   # No dimensionality reduction
    data_generating_model_regularization: L1  # Use L1 for data generation
    candidate_model_regularization: L1  # Use L1 for candidate models
  include_additional_models: False  # Only use base models, not new_models



