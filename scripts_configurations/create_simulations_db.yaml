# Key features:
# - Zero-shot constraint (W = I, no transformation learning)
# - Tests if models can be distinguished without learned transformations
# - 4 dataset sizes
# - 10 simulations per condition
# =============================================================================
"zero_shot":
    paths:
      data_generating_models: "Data/models_data_generating/full/zero_shot"
      data_generating_features_folder: Data/models_features/models_original_features/full
      reference_models_features_folder: Data/models_features/models_original_features/full 
      triplets_to_exclude: "Data/Things_data_preprocessed/Things_odd_one_out_triplets_all.pt"
      results_folder: "Results/Simulations_experiments/"
      results_file_name: "zero_shot"  
    experiment:
      N_train_triplets_list: [
                              400,
                              25600,
                              204800,
                              1638400,
                              ]
      N_concepts: 1854
      N_simulations: 10
      constraints: "zero_shot"  # Constrain W to identity matrix
      dim_reduction_method: 
      data_generating_model_regularization: 
      candidate_model_regularization: 
      include_additional_models: False

