# =============================================================================
# Shared Model Lists for Simulation Experiments
# =============================================================================
#
# This configuration file defines the neural network models names  used across different
# experiments. It provides two lists:
# 1. models: Base set of 20 models used in most experiments
# 2. new_models: Additional 10 models added for extended comparisons showed in figure S4 and S5
# We extracted the models most represntational layer activation for the THINGS dataset.
# These lists are imported by create_simulations_db.yaml using Hydra's
# composition feature (defaults: - shared_args)
#
# Model Selection Criteria:
# - Diverse architectures: CNNs (ResNet, VGG, etc.), Transformers (ViT, BERT-like)
# - Different training objectives: Supervised, self-supervised (DINO, CLIP, etc.)
# - Various model sizes: From AlexNet to Huge transformers
# - Multiple training datasets and protocols
#
# =============================================================================

# Base models - used in most experiments (20 models)
# These represent a diverse set of vision models with different architectures
# and training paradigms
models:
    - "BarlowTwins_RN50"        # Self-supervised: Barlow Twins objective
    - "Beit_V2_Large"            # Masked image modeling transformer
    - "ConvNext_Large"           # Modern CNN architecture
    - "Clip_RN50"                # Vision-language model (OpenAI CLIP)
    - "CORnet_S"                 # Brain-inspired recurrent CNN
    - "Deit3_Huge"               # Data-efficient image transformer
    - "DINOv2_ViT_Large"         # Self-supervised vision transformer
    - "DenseNet201"              # Densely connected CNN
    - "EfficientNet_B7"          # Compound scaled efficient architecture
    - "Fair_Clip_ViT_Large"      # CLIP variant (Meta AI)
    - "Fair_SLIP_ViT_Large"      # Self-supervised learning with image-text pairs
    - "Fair_SimCLR_ViT_Large"    # SimCLR with vision transformer
    - "Google_ViT_Large"         # Original vision transformer (Google)
    - "InceptionRN_V2"           # Inception-ResNet hybrid
    - "Inception_V3"             # Inception architecture
    - "ResNet50"                 # Standard ResNet baseline
    - "SWAV_RN50"                # SwAV self-supervised learning
    - "VicReg_RN50"              # Variance-Invariance-Covariance regularization
    - "VGG19"                    # Classic deep CNN
    - "NASNet_Large"             # Neural architecture search model

# Additional models - included when include_additional_models=True (10 models)
# These were added later to extend the model comparison
new_models:
    - "OpenCLIP_ConvNext_XL"     # Open-source CLIP with ConvNext
    - "ALIGN"                    # Vision-language model (Google)
    - "FLAVA_Full"               # Foundational language and vision alignment
    - "SigLIP2_Base_P16_224"     # Sigmoid loss CLIP variant
    - "AlexNet"                  # Historic CNN baseline
    - "BLIP_2"                   # Bootstrapping language-image pretraining
    - "EVA02_CLIP_Enormous"      # Large-scale CLIP variant
    - "PE_Huge"                  # Preceptuion encoder
    - "Image_Bind_Huge"          # Multi-modal binding model
    - "Clip_ViT_Large"           # CLIP with ViT backbone
    


